            <details class="studio-email-details"><summary><span><strong>Email match testing</strong><small>For approved test inboxes · private code required</small></span><span aria-hidden="true">＋</span></summary><div class="studio-email-layout"><div class="studio-email-form"><div class="studio-email-heading"><h3>Create an email test match</h3><span class="status-pill" id="mission-status">Checking email service…</span></div><p id="launch-ready-item" class="studio-form-note">Checking email service availability.</p><form id="match-launch-form"><div class="form-grid"><label>Game<select name="gameType"><option value="penalty">Football · penalty shootout</option><option value="sniper">Sniper · prediction duel</option></select></label><label>Match title<input name="packName" required maxlength="120" value="Class revision match" /></label></div><div class="form-grid"><label id="studio-football-settings">If Football is tied<select name="tieMode"><option value="draw">Draw after 5 kicks each</option><option value="sudden-death">Sudden death · up to 5 extra pairs</option></select></label><label id="studio-sniper-settings" hidden>Sniper round limit<input name="maxRounds" type="number" min="1" max="20" value="5" /></label></div><label>Private email-test code<input name="testCode" id="mail-test-code" required minlength="12" maxlength="200" type="password" autocomplete="off" placeholder="Enter your private test code" /><small>Only approved test recipients can receive these matches.</small></label><div class="player-grid"><fieldset class="player-card"><legend>Player A · first turn</legend><label>Display name<input name="playerAName" required maxlength="80" autocomplete="off" placeholder="Test player A" /></label><label>Email<input name="playerAEmail" required maxlength="254" type="email" autocomplete="email" placeholder="approved.a@example.com" /></label></fieldset><fieldset class="player-card"><legend>Player B</legend><label>Display name<input name="playerBName" required maxlength="80" autocomplete="off" placeholder="Test player B" /></label><label>Email<input name="playerBEmail" required maxlength="254" type="email" autocomplete="email" placeholder="approved.b@example.com" /></label></fieldset></div><div class="studio-form-actions"><button class="primary" id="launch-match-button" type="submit">Create match and send turn</button><span id="launch-question-summary">The active pool will be used.</span></div></form><div id="launch-result" class="launch-result" aria-live="polite" hidden></div></div><aside class="studio-email-help"><h3>What happens next?</h3><ol><li>Your active pool is copied into this match.</li><li>Player A receives a single-use turn link, valid for 48 hours.</li><li>Both players answer and choose their moves. Once both are locked, the game reveals the result.</li><li>The next turn and replay links arrive by email.</li></ol><p class="studio-form-note">Tanx assignments are available in Classroom.</p><details class="studio-service-details"><summary>Email service &amp; delivery tools</summary><button class="secondary" id="check-backend" type="button">Check email service</button><div id="mission-details" class="backend-note" aria-live="polite">Checking the email service…</div><section class="delivery-recovery" aria-labelledby="delivery-recovery-heading"><h4 id="delivery-recovery-heading">Recover a pending turn</h4><p>Use a match ID to check delivery and recover its secure turn link.</p><label>Match ID<input id="delivery-match-id" maxlength="80" placeholder="Paste a match ID" /></label><button class="secondary" id="check-delivery" type="button">Check pending delivery</button><div id="delivery-result" class="backend-note" aria-live="polite" hidden></div></section></details></aside></div></details>

  <template id="turkey-demo-template">
    <section class="match-layout">
      <article class="panel game-board turkey-board">
        <div class="scoreboard turkey-scoreboard">
          <div><small>Fighter A</small><strong>Sir Gobbles</strong><div class="health"><span id="turkey-health-a"></span></div></div>
          <div class="score-main"><span id="turkey-round">Round 1</span><small>Most health at the limit wins</small></div>
          <div><small>Fighter B</small><strong>Ninja Wing</strong><div class="health"><span id="turkey-health-b"></span></div></div>
        </div>
        <div class="farm-arena">
          <div class="sun"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
          <div class="barn-large"><span></span></div>
          <div class="fence"></div>
          <div class="turkey-character turkey-left" id="turkey-a"><div class="tail"></div><div class="body"></div><div class="head"></div><div class="beak"></div></div>
          <div class="turkey-character turkey-right" id="turkey-b"><div class="tail"></div><div class="body"></div><div class="head"></div><div class="beak"></div></div>
          <div class="fight-effect" id="fight-effect"></div>
        </div>
        <div class="event-log" id="turkey-log">Sir Gobbles must answer a question to activate a move.</div>
      </article>
      <aside class="panel turn-panel" id="turkey-turn-panel"></aside>
    </section>
  </template>

  <template id="sniper-demo-template">
    <section class="match-layout">
      <article class="panel game-board sniper-demo-board">
        <div class="scoreboard sniper-demo-scoreboard">
          <div><small>Player A</small><strong id="sniper-demo-health-a">3</strong></div>
          <div class="score-main"><span id="sniper-demo-round">Round 1</span><small>Prediction training</small></div>
          <div><small>Player B</small><strong id="sniper-demo-health-b">3</strong></div>
        </div>
        <canvas id="classroom-sniper-canvas" style="width:100%;aspect-ratio:16/9" aria-label="Two opposing village areas. Use the numbered hiding-place and prediction buttons, or tap a numbered map position."></canvas>
        <div class="event-log" id="sniper-demo-log">The simulation starts after both players lock their choices.</div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px"><button type="button" class="secondary" id="watch-classroom-sniper" disabled>Watch last simulation</button><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="classroom-sniper-motion" style="width:auto">Reduced motion</label></div>
        <div id="sniper-last-result"></div>
      </article>
      <aside class="panel turn-panel" id="sniper-turn-panel"></aside>
    </section>
  </template>
