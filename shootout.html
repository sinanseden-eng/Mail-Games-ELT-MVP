<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Answer English questions, choose your corner, and play a penalty match with animated kicks, keeper dives and a responsive goal net." />
  <title>English Match · The Penalty Club</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="shootout.css" />
  <link rel="stylesheet" href="football.css" />
</head>
<body class="shootout-page football-classroom">
  <header class="shootout-topbar">
    <a class="shootout-brand" href="./#play" aria-label="Back to Mail Games ELT">
      <span aria-hidden="true">✉</span>
      <span><strong>The Penalty Club</strong><small>English match · Mail Games ELT</small></span>
    </a>
    <div class="shootout-toolbar">
      <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true">Sound on</button>
      <button type="button" class="sound-toggle" id="motion-toggle" aria-pressed="false">Reduce motion</button>
      <button type="button" class="secondary" id="reset-shootout">Reset match</button>
      <a class="secondary button-link" href="football.html">Practice pitch ↗</a>
    </div>
  </header>

  <main class="shootout-shell">
    <section class="shootout-score" aria-label="Match scoreboard">
      <div class="score-player">
        <small>Player A</small>
        <strong id="score-a">0</strong>
      </div>
      <div class="score-centre">
        <span id="round-badge">Kick 1 of 10</span>
        <strong id="match-status">Ready for kickoff</strong>
      </div>
      <div class="score-player">
        <small>Player B</small>
        <strong id="score-b">0</strong>
      </div>
    </section>

    <section class="shootout-layout">
      <article class="shootout-stage-card">
        <div class="scene-ribbon"><span id="scene-role">Striker turn</span><strong id="scene-player">Player A</strong></div>
        <div class="shootout-scene" id="shootout-scene">
          <canvas id="shootout-canvas" width="1280" height="720" aria-label="Animated penalty shootout scene"></canvas>
          <div class="goal-zone-overlay" id="goal-zone-overlay" aria-label="Choose a goal zone" hidden>
            <button type="button" data-zone="top-left" aria-label="Top left"><span>↖</span><small>Top left</small></button>
            <button type="button" data-zone="top-centre" aria-label="Top centre"><span>↑</span><small>Top centre</small></button>
            <button type="button" data-zone="top-right" aria-label="Top right"><span>↗</span><small>Top right</small></button>
            <button type="button" data-zone="bottom-left" aria-label="Bottom left"><span>↙</span><small>Low left</small></button>
            <button type="button" data-zone="bottom-centre" aria-label="Bottom centre"><span>↓</span><small>Low centre</small></button>
            <button type="button" data-zone="bottom-right" aria-label="Bottom right"><span>↘</span><small>Low right</small></button>
          </div>
          <div class="scene-caption" id="scene-caption" aria-live="polite">Answer first. Act second.</div>
        </div>
        <div class="scene-legend">
          <span><i class="legend-dot live"></i> Correct answer: move active</span>
          <span><i class="legend-dot futile"></i> Incorrect answer: move futile</span>
          <span><i class="legend-dot net"></i> Pick your corner. Watch the finish.</span>
        </div>
      </article>

      <aside class="shootout-control-card" id="control-card" aria-live="polite"></aside>
    </section>


  </main>

  <script type="module" src="shootout-0.9h5a2.js"></script>
</body>
</html>
